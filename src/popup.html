<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Film Bridge</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <div class="perforation" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
      <section class="ticket">
        <p class="kicker">FILM BRIDGE · ADMIT TWO</p>
        <h1>Film <span>↔</span><br>Bridge</h1>
        <p class="copy">进入豆瓣、Letterboxd、IMDb（含 Critic Reviews）、TMDB 或 Metacritic 的电影页，评分卡会自动嵌入，无需再次刷新。</p>
        <div class="site-line">
          <span class="dot douban"></span><b>DOUBAN</b>
          <em></em>
          <span class="dot orange"></span><b>LETTERBOXD</b>
          <span class="dot yellow"></span><b>IMDb</b>
          <span class="dot blue"></span><b>TMDB</b>
        </div>
        <button id="open-options" type="button">评分来源与设置 <span>→</span></button>
      </section>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
